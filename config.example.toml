# omarchy-live-translator configuration
# Copy to ~/.config/omarchy-live-translator/config.toml and edit as needed.

control_port = 8670
log_dir = "~/.local/state/omarchy-live-translator"
log_level = "INFO"

# Testing aid: dump every capture to WAV for waveform inspection.
debug_capture = true
debug_dir = "~/.local/state/omarchy-live-translator/debug"
debug_keep = 20

# Audio pre-processing before ASR (helps quiet/muffled capture).
preprocess_enable = true
highpass_hz = 120.0
preamp_db = 6.0
chunk_ms = 160

[paths]
nemo_speech = "~/.local/bin/nemo-speech"
piper = "~/.local/bin/piper"
libretranslate_url = "http://127.0.0.1:5001"

[asr]
model = "nemotron-3.5"
device = "vulkan:0"
preload_stdcxx = true
host = "127.0.0.1"
port = 8080

[tts]
engine = "piper"
voice_en = "en_US-lessac-medium"
voice_es = "es_ES-davefx-medium"
voices_dir = "~/.local/share/piper/voices"
sample_rate = 22050

[outgoing]
language = "en-US"
target = "es"
auto_speak_after_ms = 0
output_destination = "speakers"
virtual_mic = "olt-virtual-mic"
speakers_sink = "@DEFAULT_SINK@"

[incoming]
enabled = true
source_language = "es-ES"
target = "en"
source_device = "@DEFAULT_MONITOR@"
endpointing_ms = 800
multimedia = true
multimedia_endpointing_ms = 1600

[glossary]
enabled = true
phrases = ["Matt", "Mat", "Mac", "Max", "amat", "mc", "mcway", "Mattacito", "Maxacito", "Danna", "Roblox", "Robus", "Roblo", "robla"]
boost = 3.0

[activation]
enabled = false
app_class = ""
app_title = ""

[overlay]
position = "top-right"
history = true
